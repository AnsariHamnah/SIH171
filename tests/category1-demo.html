<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIH 26171 - Category 1 Demo Page</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 600px; margin: 2rem auto; padding: 1rem; }
    .form-group { margin-bottom: 1rem; }
    label { display: block; margin-bottom: 0.5rem; font-weight: 500; }
    input[type="text"] { width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    button { padding: 0.75rem 1.5rem; background: #0066cc; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; }
    button:hover { background: #0052a3; }
    #result { margin-top: 1rem; padding: 1rem; background: #f5f5f5; border-radius: 4px; display: none; }
    .success { background: #d4edda; color: #155724; }
    .error { background: #f8d7da; color: #721c24; }
  </style>
</head>
<body>
  <h1>Category 1 Demo Page</h1>
  <p>This page demonstrates the end-to-end flow for a non-sensitive form.</p>
  
  <form id="demo-form">
    <div class="form-group">
      <label for="display-name">Display Name</label>
      <input 
        type="text" 
        id="display-name" 
        name="displayName" 
        placeholder="Enter your display name"
        autocomplete="off"
      />
    </div>
    
    <button type="submit" id="submit-button">Submit</button>
  </form>
  
  <div id="result"></div>

  <script>
    // Handle form submission
    document.getElementById('demo-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const input = document.getElementById('display-name');
      const resultDiv = document.getElementById('result');
      resultDiv.textContent = 'Form submitted with: ' + input.value;
      resultDiv.className = 'success';
      resultDiv.style.display = 'block';
    });
  </script>
</body>
</html>
