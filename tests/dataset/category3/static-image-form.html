<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Static Image Form</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 500px; margin: 2rem auto; padding: 1rem; }
    .form-image { border: 1px solid #ccc; border-radius: 4px; background: #f5f5f5; padding: 2rem; text-align: center; }
    .form-image img { max-width: 100%; height: auto; border: 1px solid #ddd; border-radius: 4px; }
    .legend { font-size: 0.75rem; color: #666; text-align: center; margin-top: 0.5rem; }
    .dom-fields { margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid #eee; }
    .form-group { margin-bottom: 1rem; }
    label { display: block; margin-bottom: 0.5rem; font-weight: 500; }
    input { width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    button { width: 100%; padding: 0.75rem; background: #0066cc; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; }
    button:hover { background: #0052a3; }
  </style>
</head>
<body>
  <h1>Static Image Form</h1>
  <p>This page contains a form rendered as a static image.</p>
  
  <div class="form-image">
    <svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" id="form-svg">
      <rect x="0" y="0" width="400" height="300" fill="#f5f5f5"/>
      <text x="200" y="40" text-anchor="middle" font-family="system-ui" font-size="20" font-weight="bold" fill="#333">Image Form</text>
      <text x="50" y="80" font-family="system-ui" font-size="14" fill="#666">Email</text>
      <rect x="50" y="90" width="300" height="38" stroke="#ccc" stroke-width="1" fill="white"/>
      <text x="60" y="115" font-family="monospace" font-size="16" fill="#333">image@example.test</text>
      <text x="50" y="160" font-family="system-ui" font-size="14" fill="#666">Password</text>
      <rect x="50" y="170" width="300" height="38" stroke="#ccc" stroke-width="1" fill="white"/>
      <text x="60" y="195" font-family="monospace" font-size="16" fill="#333">\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022</text>
      <rect x="50" y="230" width="300" height="44" fill="#0066cc" rx="4"/>
      <text x="200" y="258" text-anchor="middle" font-family="system-ui" font-size="16" font-weight="bold" fill="white">Submit</text>
    </svg>
    <div class="legend">SVG-rendered form (email & password as static image)</div>
  </div>
  
  <div class="dom-fields">
    <h3>Standard DOM Fields (for comparison)</h3>
    <form id="dom-form">
      <div class="form-group">
        <label for="dom-email">Email (DOM)</label>
        <input type="email" id="dom-email" name="email" autocomplete="email" placeholder="user@example.test" value="svg@example.test">
      </div>
      <div class="form-group">
        <label for="dom-password">Password (DOM)</label>
        <input type="password" id="dom-password" name="password" autocomplete="current-password" value="svgPass123">
      </div>
      <button type="submit" id="dom-submit">Submit DOM Form</button>
    </form>
  </div>
</body>
</html>
