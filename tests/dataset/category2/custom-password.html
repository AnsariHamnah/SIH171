<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom Styled Password Field</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 400px; margin: 2rem auto; padding: 1rem; }
    .form-group { margin-bottom: 1rem; }
    label { display: block; margin-bottom: 0.5rem; font-weight: 500; }
    .custom-password { width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-family: monospace; letter-spacing: 0.1em; background: #f5f5f5; }
    .password-label { color: #666; font-size: 0.875rem; margin-bottom: 0.25rem; }
    button { width: 100%; padding: 0.75rem; background: #0066cc; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; }
    button:hover { background: #0052a3; }
  </style>
</head>
<body>
  <h1>Custom Styled Password</h1>
  <p>This page uses a generic text input styled to look like a password field.</p>
  <form id="custom-form">
    <div class="form-group">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" autocomplete="username" placeholder="Enter username" value="testuser">
    </div>
    <div class="form-group">
      <div class="password-label">Password (custom styled)</div>
      <input type="text" id="custom-password" name="password" class="custom-password" placeholder="Enter password" value="mySecretPass123" data-sensitive="true">
    </div>
    <button type="submit" id="custom-submit">Submit</button>
  </form>
</body>
</html>
